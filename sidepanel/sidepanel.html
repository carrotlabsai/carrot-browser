<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Carrot</title>
  <link rel="stylesheet" href="../ui/tokens.css" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="sp-shell">
    <header class="sp-header">
      <div class="sp-status-dot" id="statusIndicator" title="Connecting…">
        <span class="cl-dot"></span>
      </div>
      <div class="sp-brand">Carrot Browser</div>
      <button
        class="sp-icon-btn"
        id="openSettings"
        title="Settings"
        aria-label="Open settings"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <main class="sp-main">
      <!-- Pairing + connected agents. -->
      <section class="cl-card sp-pairing-card" id="pairingCard">
        <div class="cl-card-title"><span>Agent Pairing</span></div>
        <div class="sp-scope-field">
          <span class="sp-scope-icon" id="scopeIcon" aria-hidden="true"></span>
          <select class="cl-select sp-scope-select" id="scopeSelect" aria-label="Access scope">
            <option value="browser">All tabs · full browser</option>
          </select>
        </div>
        <button class="cl-btn cl-btn-primary sp-cta" id="generateCode">
          <span>Pair an Agent</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
          </svg>
        </button>
        <div class="sp-code" id="codeDisplay" hidden>
          <div class="sp-code-value" id="pairingCode">—</div>
          <div class="sp-code-hint">
            <span id="codeHint">Give this code to the agent · expires in <span id="codeExpiry">5</span> min</span>
          </div>
          <button class="cl-btn cl-btn-secondary" id="copyCode">
            Copy Code
          </button>
        </div>
        <div class="sp-agent-stack" id="agentStack" hidden>
          <div class="cl-card-title"><span>Connected Agents</span></div>
          <div class="sp-sessions" id="sessionsList"></div>
        </div>
      </section>

      <!-- Live activity feed — only visible during an active session. -->
      <section class="cl-card sp-activity-card" id="activityCard">
        <div class="cl-card-title">
          <span>Activity</span>
          <button class="sp-clear" id="clearActivity" title="Clear">Clear</button>
        </div>
        <div class="sp-activity" id="activityList"></div>
      </section>
    </main>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
